  function updateLive(){const form=document.getElementById('entry-form');if(!form)return;const f=new FormData(form),job=jobFor(f.get('jobId')),e={start:f.get('start'),end:f.get('end'),breakMinutes:Number(f.get('breakMinutes')),hourlyRate:(modalType==='edit-entry'&&state.entries.find(x=>x.id===modalEditId)?.jobId===f.get('jobId'))?state.entries.find(x=>x.id===modalEditId)?.hourlyRate:job?.rate};const mins=elapsed(e);const good=f.get('start')!==f.get('end')&&mins>0;document.getElementById('live-hours').textContent=good?`${number(mins/60)} timmar (efter rast)`:'Kontrollera tiderna';document.getElementById('live-earnings').textContent=good?money(cost(e)):'– kr'}
  function validateEntry(x){if(!jobs().some(j=>j.id===x.jobId))return 'Välj ett jobb.';if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!/^\d\d:\d\d$/.test(x.start)||!/^\d\d:\d\d$/.test(x.end))return 'Fyll i datum och tider.';if(x.start===x.end)return 'Start- och sluttid kan inte vara samma.';if(!Number.isInteger(x.breakMinutes)||x.breakMinutes<0||x.breakMinutes>=1440)return 'Rasten måste vara mellan 0 och 1439 minuter.';if(elapsed(x)<=0)return 'Rasten kan inte vara lika lång som eller längre än arbetspasset.';return ''}

  async function toggleFixedMonth(id,month){
    const f=fixedIncomes().find(x=>x.id===id);

    f.excludedMonths=[...skipped].sort();
    persist();render();toast(skipped.has(month)?'Månaden hoppas över':'Månaden är aktiv igen');await cloudUpsertFixed(f);
  }

  async function importData(file){
    if(!file)return;
    try{
      if(file.size>5*1024*1024)throw new Error('Filen är för stor.');
      const data=JSON.parse(await file.text());
      if(!data||!Array.isArray(data.jobs)||!Array.isArray(data.entries))throw new Error('Filen är inte en giltig Timmar-säkerhetskopia.');
      const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const ids=new Set();
      const importedJobs=data.jobs.map(j=>{
        if(!uuid.test(j.id)||ids.has(j.id))throw new Error('Ogiltigt jobb-ID i filen.');
        ids.add(j.id);
        if(typeof j.name!=='string'||!j.name.trim()||j.name.length>60||!Number.isFinite(Number(j.rate))||Number(j.rate)<=0||Number(j.rate)>100000)throw new Error('Ett jobb har ogiltigt namn eller timlön.');
        return {id:j.id,name:j.name.trim(),rate:Number(j.rate),color:colors.includes(j.color)?j.color:colors[0],createdAt:!isNaN(Date.parse(j.createdAt))?j.createdAt:new Date().toISOString()};
      });
      const shifts=data.entries.map(e=>{
        if(!uuid.test(e.id)||ids.has(e.id))throw new Error('Ogiltigt eller duplicerat pass-ID.');
        ids.add(e.id);
        const x={id:e.id,jobId:e.jobId,date:e.date,start:e.start,end:e.end,breakMinutes:Number(e.breakMinutes),hourlyRate:Number(e.hourlyRate),note:typeof e.note==='string'?e.note:'',createdAt:!isNaN(Date.parse(e.createdAt))?e.createdAt:new Date().toISOString()};
        if(!importedJobs.some(j=>j.id===x.jobId)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.end)||x.start===x.end||!Number.isInteger(x.breakMinutes)||x.breakMinutes<0||x.breakMinutes>=1440||elapsed(x)<=0||!Number.isFinite(x.hourlyRate)||x.hourlyRate<=0||x.hourlyRate>100000||x.note.length>180)throw new Error('Ett arbetspass har ogiltiga uppgifter.');
        return x;
      });
      const incomes=(data.fixedIncomes||[]).map(f=>{
        if(!uuid.test(f.id)||ids.has(f.id))throw new Error('Ogiltigt ID för fast inkomst.');
        ids.add(f.id);
        const item={id:f.id,name:String(f.name||'').trim(),amount:Number(f.amount),paymentDay:Number(f.paymentDay),startMonth:f.startMonth,endMonth:f.endMonth||'',annualSkips:f.annualSkips||[],excludedMonths:f.excludedMonths||[],createdAt:!isNaN(Date.parse(f.createdAt))?f.createdAt:new Date().toISOString()};
        if(!item.name||item.name.length>60||!Number.isFinite(item.amount)||item.amount<=0||item.amount>10000000||!Number.isInteger(item.paymentDay)||item.paymentDay<1||item.paymentDay>31||!validMonth(item.startMonth)||(item.endMonth&&(!validMonth(item.endMonth)||item.endMonth<item.startMonth))||!Array.isArray(item.annualSkips)||!item.annualSkips.every(x=>Number.isInteger(x)&&x>=1&&x<=12)||!Array.isArray(item.excludedMonths)||!item.excludedMonths.every(validMonth))throw new Error('En fast inkomst har ogiltiga uppgifter.');
        return item;
      });
      if(!confirm(`Återställa ${importedJobs.length} jobb, ${shifts.length} arbetspass och ${incomes.length} fasta inkomster? Dina nuvarande lokala uppgifter ersätts. Exportera dem först om du vill behålla dem.`))return;
      state={jobs:importedJobs,entries:shifts,fixedIncomes:incomes,demo:false,active:'home'};
      persist();closeModal();render();toast('Säkerhetskopian återställd. Ladda upp till molnet om du använder Supabase.');
    }catch(err){alert('Kunde inte läsa in säkerhetskopian: '+(err?.message||'Ogiltig fil'));}
  }
  async function initCloud(){if(!config.url||!config.key)return;try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloud=mod.createClient(config.url,config.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});const {data,error}=await cloud.auth.getSession();if(error)throw error;cloudUser=data.session?.user||null;cloud.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;setTimeout(()=>{render();if(modalType==='settings')renderModal();if(event==='SIGNED_IN')loadCloud({auto:true})},0)});cloudError='';render();if(modalType==='settings')renderModal();if(cloudUser)await loadCloud({auto:true})}catch(err){cloudError='Kunde inte ansluta: '+(err.message||'kontrollera projektuppgifterna och internetanslutningen');cloud=null;cloudUser=null;render();if(modalType==='settings')renderModal()}}
  function cloudReady(){return !!cloud&&!!cloudUser}
  async function dbRequest(work){if(!cloudReady())return;try{const {error}=await work();if(error)throw error;cloudError=''}catch(err){cloudError=`Molnsynkning misslyckades: ${err.message||err}. Uppgifterna finns sparade lokalt. Försök igen i Inställningar.`;toast('Sparat lokalt – molnsynkning misslyckades')}}
  const jobRow=j=>({id:j.id,user_id:cloudUser.id,name:j.name,hourly_rate:j.rate,color:j.color,created_at:j.createdAt});
  const entryRow=e=>({id:e.id,user_id:cloudUser.id,job_id:e.jobId,work_date:e.date,start_time:e.start,end_time:e.end,break_minutes:e.breakMinutes,hourly_rate:e.hourlyRate,note:e.note,created_at:e.createdAt});
  const fixedRow=f=>({id:f.id,user_id:cloudUser.id,name:f.name,amount:f.amount,payment_day:f.paymentDay,start_month:`${f.startMonth}-01`,end_month:f.endMonth?`${f.endMonth}-01`:null,annual_skips:f.annualSkips||[],skipped_months:f.excludedMonths||[],created_at:f.createdAt});
  async function cloudUpsertJob(j){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from('jobs').upsert(jobRow(j)))}
  async function cloudUpsertFixed(f){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from('fixed_incomes').upsert(fixedRow(f)))}
  async function cloudUpsertEntry(e){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from('work_shifts').upsert(entryRow(e)))}
  async function cloudRemove(table,id){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from(table).delete().eq('id',id))}
  async function loadCloud({auto=false}={}){
    if(!cloudReady())return;
    try{
      const [{data:j,error:je},{data:e,error:ee},{data:f,error:fe}]=await Promise.all([
        cloud.from('jobs').select('*').order('created_at',{ascending:true}),
        cloud.from('work_shifts').select('*').order('work_date',{ascending:false}),
        cloud.from('fixed_incomes').select('*').order('created_at',{ascending:true})
      ]);
      if(je||ee||fe)throw je||ee||fe;
      if(auto&&!state.demo&&(state.jobs.length||state.entries.length||fixedIncomes().length))return;
      if(auto&&!j?.length&&!f?.length&&state.demo)return;
      state.jobs=(j||[]).map(x=>({id:x.id,name:x.name,rate:Number(x.hourly_rate),color:x.color,createdAt:x.created_at}));
      state.entries=(e||[]).map(x=>({id:x.id,jobId:x.job_id,date:x.work_date,start:x.start_time.slice(0,5),end:x.end_time.slice(0,5),breakMinutes:Number(x.break_minutes),hourlyRate:Number(x.hourly_rate),note:x.note||'',createdAt:x.created_at}));
      state.fixedIncomes=(f||[]).map(x=>({id:x.id,name:x.name,amount:Number(x.amount),paymentDay:Number(x.payment_day),startMonth:x.start_month.slice(0,7),endMonth:x.end_month?.slice(0,7)||'',annualSkips:(x.annual_skips||[]).map(Number),excludedMonths:x.skipped_months||[],createdAt:x.created_at}));
      state.demo=false;state.active='home';persist();cloudError='';render();if(modalType==='settings')renderModal();if(!auto)toast('Dina uppgifter har hämtats från Supabase');
    }catch(err){cloudError='Hämtning misslyckades: '+(err.message||'okänt fel')+' (kontrollera att databasuppdateringen för v1.4 har körts i Supabase)';if(modalType==='settings')renderModal()}
  }
  async function pushCloud(){
    if(!cloudReady()||state.demo)return;
    try{
      cloudBusy=true;const jr=jobs().map(jobRow),er=state.entries.map(entryRow),fr=fixedIncomes().map(fixedRow);
      if(jr.length){const {error}=await cloud.from('jobs').upsert(jr);if(error)throw error}
      if(er.length){const {error}=await cloud.from('work_shifts').upsert(er);if(error)throw error}
      if(fr.length){const {error}=await cloud.from('fixed_incomes').upsert(fr);if(error)throw error}
      cloudError='';toast('Lokala jobb, arbetspass och fasta inkomster uppladdade till Supabase');
    }catch(err){cloudError='Uppladdning misslyckades: '+(err.message||'kontrollera databasen');toast('Kunde inte ladda upp allt')}
    finally{cloudBusy=false;if(modalType==='settings')renderModal()}
  }
  document.addEventListener('click',async ev=>{
    if(ev.target.id==='modal-backdrop'){closeModal();return}
    const el=ev.target.closest('[data-action],[data-go]');if(!el)return;
    if(el.dataset.go){state.active=el.dataset.go;drawerOpen=false;render();window.scrollTo({top:0,behavior:'auto'});return}
    const a=el.dataset.action;
    if(a==='drawer-open'){drawerOpen=true;render()}else if(a==='drawer-close'){drawerOpen=false;render()}else if(a==='new-job')openModal('new-job');else if(a==='new-fixed')openModal('new-fixed');else if(a==='edit-fixed')openModal('edit-fixed',el.dataset.id);else if(a==='fixed-prev-year'){fixedYear--;render()}else if(a==='fixed-next-year'){fixedYear++;render()}else if(a==='fixed-toggle-month')await toggleFixedMonth(el.dataset.id,el.dataset.month);else if(a==='delete-fixed')await removeFixed();else if(a==='edit-job')openModal('edit-job',el.dataset.id);else if(a==='new-entry'&&jobs().length)openModal('new-entry');else if(a==='edit-entry')openModal('edit-entry',el.dataset.id);else if(a==='close-modal')closeModal();else if(a==='color'){colorSelected=el.dataset.color;document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b.dataset.color===colorSelected))}else if(a==='delete-entry')await removeEntry();else if(a==='delete-job')await removeJob();else if(a==='settings')openModal('settings');else if(a==='clear-demo')resetDemo();else if(a==='load-demo')setDemo();else if(a==='show-all'){state.active='all';render();window.scrollTo({top:0,behavior:'auto'})}else if(a==='export')exportData();else if(a==='import')document.getElementById('backup-file')?.click();else if(a==='cloud-pull'){if(confirm('Ersätta innehållet i appen med data från Supabase? Lokala uppgifter som inte har laddats upp kan gå förlorade.'))await loadCloud()}else if(a==='cloud-push')await pushCloud();else if(a==='cloud-logout'&&cloud){await cloud.auth.signOut();cloudUser=null;renderModal();render()}
  });
  document.addEventListener('input',e=>{if(e.target.closest('#entry-form'))updateLive()});document.addEventListener('change',e=>{if(e.target.closest('#entry-form'))updateLive()});
  document.addEventListener('submit',async e=>{
    if(e.target.id==='job-form'){e.preventDefault();await saveJob(e.target)}
    if(e.target.id==='fixed-form'){e.preventDefault();await saveFixed(e.target)}
    if(e.target.id==='entry-form'){e.preventDefault();await saveEntry(e.target)}
    if(e.target.id==='cloud-form'){e.preventDefault();const f=new FormData(e.target),url=String(f.get('cloudUrl')||'').trim().replace(/\/$/,''),key=String(f.get('cloudKey')||'').trim();if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)||!key){cloudError='Ange Supabase Project URL och en giltig publishable/anon key.';renderModal();return}config={url,key};localStorage.setItem(CONFIG,JSON.stringify(config));cloudError='';cloudNotice='';cloud=null;cloudUser=null;renderModal();await initCloud();toast('Supabase-inställningarna sparade')}
    if(e.target.id==='set-password-form'){
      e.preventDefault();
      if(!cloudReady()){cloudError='Du måste vara inloggad för att skapa ett lösenord.';cloudNotice='';renderModal();return}
      const f=new FormData(e.target),password=String(f.get('newPassword')||''),confirmPassword=String(f.get('confirmPassword')||'');
      if(password.length<12||password!==confirmPassword){cloudError=password.length<12?'Använd minst 12 tecken i lösenordet.':'Lösenorden stämmer inte överens.';cloudNotice='';renderModal();return}
      try{
        cloudBusy=true;
        const {error}=await cloud.auth.updateUser({password});
        if(error)throw error;
        cloudError='';cloudNotice='Lösenordet har sparats för ditt befintliga konto. Du kan nu logga in med samma e-post och lösenord på iPhone.';
        renderModal();
      }catch(err){cloudNotice='';cloudError='Lösenordet kunde inte sparas: '+(err.message||'okänt fel')+'. Om Supabase kräver ny verifiering, logga in på nytt via mejllänken i Mac-webbläsaren.';renderModal()}
      finally{cloudBusy=false}
    }
    if(e.target.id==='password-login-form'){
      e.preventDefault();
      if(!cloud){cloudError='Anslut Supabase-projektet först.';cloudNotice='';renderModal();return}
      const f=new FormData(e.target),email=String(f.get('loginEmail')||'').trim(),password=String(f.get('loginPassword')||'');
      if(!email||!password){cloudError='Fyll i både e-post och lösenord.';cloudNotice='';renderModal();return}
      try{
        cloudBusy=true;
        const {data,error}=await cloud.auth.signInWithPassword({email,password});
        if(error)throw error;
        if(!data?.user)throw new Error('Ingen inloggad användare returnerades');
        cloudUser=data.user;cloudError='';cloudNotice='Du är inloggad med lösenord.';
        render();if(modalType==='settings')renderModal();toast('Inloggad i Supabase');
      }catch(err){cloudNotice='';cloudError='Inloggningen misslyckades: '+(err.message||'kontrollera e-post och lösenord');renderModal()}
      finally{cloudBusy=false}
    }
    if(e.target.id==='email-form'){
      e.preventDefault();
      if(!cloud){cloudError='Anslutningen är inte klar. Kontrollera projektuppgifterna.';cloudNotice='';renderModal();return}
      const email=String(new FormData(e.target).get('cloudEmail')||'').trim();
      try{
        cloudBusy=true;
        const {error}=await cloud.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.protocol==='file:'?undefined:location.origin+location.pathname}});
        if(error)throw error;
        cloudError='';cloudNotice='En inloggningslänk har begärts till '+email+'. Öppna den i samma webbläsare där Timmar och Supabase-inställningarna finns.';
        renderModal();
      }catch(err){cloudNotice='';cloudError=err.message||'Det gick inte att skicka mejlet';renderModal()}
      finally{cloudBusy=false}
    }
  });
  document.addEventListener('change',async e=>{if(e.target?.id==='backup-file'){const file=e.target.files?.[0];await importData(file);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalType)closeModal()});
  render();if(config.url&&config.key)initCloud();
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Appinstallationsstöd kunde inte aktiveras:',err)));
  }
})();
</script>
