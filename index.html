<script>

  'use strict';

  const colors=['#aeb9fb','#75d8b7','#f5b87c','#ed9dbd','#92c9e7','#c3a6ed'];
  const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',plus:'<path d="M12 5v14M5 12h14"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>',wallet:'<rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10h18M15 15h3"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',settings:'<path d="M10 3h4l.7 2.4 2 1.1 2.4-.6 2 3.5-1.8 1.7v2.2l1.8 1.7-2 3.5-2.4-.6-2 1.1L14 21h-4l-.7-2.4-2-1.1-2.4.6-2-3.5 1.8-1.7v-2.2L2.9 9l2-3.5 2.4.6 2-1.1z"/><circle cx="12" cy="12" r="3"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',x:'<path d="M5 5l14 14M19 5 5 19"/>',edit:'<path d="m4 16 11-11 4 4-11 11H4zM13 7l4 4"/>',trash:'<path d="M4 7h16M10 4h4m-8 3 1 14h10l1-14M10 11v6M14 11v6"/>',chart:'<path d="M3 20h18M6 16V9m6 7V4m6 12V7"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8v.1"/>',cloud:'<path d="M7 18a5 5 0 1 1 .7-9.9A6.5 6.5 0 0 1 20 11a3.5 3.5 0 0 1-1 7z"/>',logout:'<path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 7l5 5-5 5M9 12h10"/>',check:'<path d="m4 12 5 5L20 6"/>'};
  const ico=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[n]||icons.info}</svg>`;
  const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx`.replace(/[xy]/g,c=>{let r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16)});
  const h=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money=n=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:2}).format(Math.round((Number(n)||0)*100)/100)+' kr';
  const number=n=>new Intl.NumberFormat('sv-SE',{maximumFractionDigits:1}).format(Math.round((Number(n)||0)*10)/10);
  const dateISO=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dateISO(d)};
  const monthAgo=(n,day)=>{const d=new Date();return `${d.getFullYear()-Math.floor((d.getMonth()-n+12)%12/12)}-${String(((d.getMonth()-n+120)%12)+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`};
  function safeMonthShift(d,delta){return new Date(d.getFullYear(),d.getMonth()+delta,1)}
  const shortDate=s=>new Date(s+'T12:00:00').toLocaleDateString('sv-SE',{day:'numeric',month:'short',year:'numeric'});
  const shortMonth=d=>d.toLocaleDateString('sv-SE',{month:'short'}).replace('.','');
  const monthName=d=>d.toLocaleDateString('sv-SE',{month:'long',year:'numeric'});
  function elapsed(entry){const start=String(entry.start||'00:00').split(':').map(Number);const end=String(entry.end||'00:00').split(':').map(Number);let minutes=(end[0]*60+end[1])-(start[0]*60+start[1]);if(minutes<0)minutes+=1440;return Math.max(0,minutes-Number(entry.breakMinutes||0));}
  const cost=e=>elapsed(e)/60*Number(e.hourlyRate||0);
  const hours=es=>es.reduce((a,e)=>a+elapsed(e)/60,0);
  const earn=es=>es.reduce((a,e)=>a+cost(e),0);
  function initialData(){
    const a={id:uid(),name:'Simtränare',rate:180,color:colors[0],createdAt:new Date().toISOString()};
    const b={id:uid(),name:'Eventpersonal',rate:165,color:colors[1],createdAt:new Date().toISOString()};
    const shifts=[
      [a,2,'17:00','19:30',0,'Kvällsträning'],[a,5,'16:00','18:00',0,'A-gruppen'],[b,7,'09:00','16:30',30,'Helgpass'],[a,12,'17:00','19:00',0,'Träning'],[a,20,'16:00','18:30',0,'A-gruppen'],

  function updateLive(){const form=document.getElementById('entry-form');if(!form)return;const f=new FormData(form),job=jobFor(f.get('jobId')),e={start:f.get('start'),end:f.get('end'),breakMinutes:Number(f.get('breakMinutes')),hourlyRate:(modalType==='edit-entry'&&state.entries.find(x=>x.id===modalEditId)?.jobId===f.get('jobId'))?state.entries.find(x=>x.id===modalEditId)?.hourlyRate:job?.rate};const mins=elapsed(e);const good=f.get('start')!==f.get('end')&&mins>0;document.getElementById('live-hours').textContent=good?`${number(mins/60)} timmar (efter rast)`:'Kontrollera tiderna';document.getElementById('live-earnings').textContent=good?money(cost(e)):'– kr'}
  function validateEntry(x){if(!jobs().some(j=>j.id===x.jobId))return 'Välj ett jobb.';if(!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!/^\d\d:\d\d$/.test(x.start)||!/^\d\d:\d\d$/.test(x.end))return 'Fyll i datum och tider.';if(x.start===x.end)return 'Start- och sluttid kan inte vara samma.';if(!Number.isInteger(x.breakMinutes)||x.breakMinutes<0||x.breakMinutes>=1440)return 'Rasten måste vara mellan 0 och 1439 minuter.';if(elapsed(x)<=0)return 'Rasten kan inte vara lika lång som eller längre än arbetspasset.';return ''}
  async function saveJob(form){const editing=modalType==='edit-job';const f=new FormData(form),name=String(f.get('jobName')||'').trim(),rate=Number(f.get('jobRate'));if(!name||!Number.isFinite(rate)||rate<=0||rate>100000){modalMessage='Fyll i ett jobbnamn och en giltig timlön över 0 kr.';renderModal();return}let j;if(modalType==='edit-job'){j=jobFor(modalEditId);Object.assign(j,{name,rate,color:colorSelected})}else{j={id:uid(),name,rate,color:colorSelected,createdAt:new Date().toISOString()};state.jobs.push(j);state.active=j.id}persist();closeModal();render();toast(editing?'Jobbet uppdaterat':'Jobbet har lagts till');await cloudUpsertJob(j)}
  async function saveEntry(form){const f=new FormData(form),j=jobFor(f.get('jobId')),old=modalType==='edit-entry'?state.entries.find(e=>e.id===modalEditId):null;const e={id:old?.id||uid(),jobId:String(f.get('jobId')),date:String(f.get('date')),start:String(f.get('start')),end:String(f.get('end')),breakMinutes:Number(f.get('breakMinutes')),hourlyRate:old&&old.jobId===f.get('jobId')?Number(old.hourlyRate):Number(j?.rate||0),note:String(f.get('note')||'').trim(),createdAt:old?.createdAt||new Date().toISOString()};const err=validateEntry(e);if(err){modalMessage=err;renderModal();return}if(old)Object.assign(old,e);else state.entries.push(e);persist();closeModal();render();toast(old?'Arbetspasset uppdaterat':'Arbetspasset sparat');await cloudUpsertEntry(e)}
  async function removeEntry(){const e=state.entries.find(x=>x.id===modalEditId);if(!e||!confirm('Vill du radera det här arbetspasset?'))return;state.entries=state.entries.filter(x=>x.id!==e.id);persist();closeModal();render();toast('Arbetspasset har raderats');await cloudRemove('work_shifts',e.id)}
  async function removeJob(){const j=jobFor(modalEditId);if(!j)return;const n=state.entries.filter(e=>e.jobId===j.id).length;if(!confirm(`Radera ”${j.name}” och alla dess ${n} arbetspass? Detta kan inte ångras.`))return;state.jobs=state.jobs.filter(x=>x.id!==j.id);state.entries=state.entries.filter(x=>x.jobId!==j.id);state.active='home';persist();closeModal();render();toast('Jobbet och arbetspassen har raderats');await cloudRemove('jobs',j.id)}
  function resetDemo(){if(!confirm('Vill du rensa exempeljobben och exempelpass? Alla data som visas i appen raderas lokalt.'))return;state={jobs:[],entries:[],active:'home',demo:false};persist();closeModal();render();toast('Exempeldata rensad. Lägg till ditt första jobb!')}
  function setDemo(){if((jobs().length||state.entries.length)&&!confirm('Byta ut det du har i appen mot exempeldata? Dina nuvarande lokala data kommer att ersättas.'))return;state=initialData();persist();closeModal();render();toast('Exempeldata visas')}
  function exportData(){const data=JSON.stringify({exportedAt:new Date().toISOString(),...state},null,2),blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`timmar-backup-${dateISO(new Date())}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Säkerhetskopian laddas ner')}
  async function importData(file){
    if(!file)return;
    try{
      if(file.size>5*1024*1024)throw new Error('Filen är för stor.');
      const data=JSON.parse(await file.text());
      if(!data||!Array.isArray(data.jobs)||!Array.isArray(data.entries))throw new Error('Filen är inte en giltig Timmar-säkerhetskopia.');
      const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const ids=new Set();
      const importedJobs=data.jobs.map(j=>{
        if(!uuid.test(j.id)||ids.has(j.id))throw new Error('Ogiltigt jobb-ID i filen.');
        ids.add(j.id);
        if(typeof j.name!=='string'||!j.name.trim()||j.name.length>60||!Number.isFinite(Number(j.rate))||Number(j.rate)<=0||Number(j.rate)>100000)throw new Error('Ett jobb har ogiltigt namn eller timlön.');
        return {id:j.id,name:j.name.trim(),rate:Number(j.rate),color:colors.includes(j.color)?j.color:colors[0],createdAt:!isNaN(Date.parse(j.createdAt))?j.createdAt:new Date().toISOString()};
      });
      const shifts=data.entries.map(e=>{
        if(!uuid.test(e.id)||ids.has(e.id))throw new Error('Ogiltigt eller duplicerat pass-ID.');
        ids.add(e.id);
        const x={id:e.id,jobId:e.jobId,date:e.date,start:e.start,end:e.end,breakMinutes:Number(e.breakMinutes),hourlyRate:Number(e.hourlyRate),note:typeof e.note==='string'?e.note:'',createdAt:!isNaN(Date.parse(e.createdAt))?e.createdAt:new Date().toISOString()};
        if(!importedJobs.some(j=>j.id===x.jobId)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(x.end)||x.start===x.end||!Number.isInteger(x.breakMinutes)||x.breakMinutes<0||x.breakMinutes>=1440||elapsed(x)<=0||!Number.isFinite(x.hourlyRate)||x.hourlyRate<=0||x.hourlyRate>100000||x.note.length>180)throw new Error('Ett arbetspass har ogiltiga uppgifter.');
        return x;
      });
      if(!confirm(`Återställa ${importedJobs.length} jobb och ${shifts.length} arbetspass? Dina nuvarande lokala uppgifter ersätts. Exportera dem först om du vill behålla dem.`))return;
      state={jobs:importedJobs,entries:shifts,demo:false,active:'home'};
      persist();closeModal();render();toast('Säkerhetskopian återställd. Ladda upp till molnet om du använder Supabase.');
    }catch(err){alert('Kunde inte läsa in säkerhetskopian: '+(err?.message||'Ogiltig fil'));}
  }
  async function initCloud(){if(!config.url||!config.key)return;try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloud=mod.createClient(config.url,config.key,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});const {data,error}=await cloud.auth.getSession();if(error)throw error;cloudUser=data.session?.user||null;cloud.auth.onAuthStateChange((event,session)=>{cloudUser=session?.user||null;setTimeout(()=>{render();if(modalType==='settings')renderModal();if(event==='SIGNED_IN')loadCloud({auto:true})},0)});cloudError='';render();if(modalType==='settings')renderModal();if(cloudUser)await loadCloud({auto:true})}catch(err){cloudError='Kunde inte ansluta: '+(err.message||'kontrollera projektuppgifterna och internetanslutningen');cloud=null;cloudUser=null;render();if(modalType==='settings')renderModal()}}
  function cloudReady(){return !!cloud&&!!cloudUser}
  async function dbRequest(work){if(!cloudReady())return;try{const {error}=await work();if(error)throw error;cloudError=''}catch(err){cloudError=`Molnsynkning misslyckades: ${err.message||err}. Uppgifterna finns sparade lokalt. Försök igen i Inställningar.`;toast('Sparat lokalt – molnsynkning misslyckades')}}
  const jobRow=j=>({id:j.id,user_id:cloudUser.id,name:j.name,hourly_rate:j.rate,color:j.color,created_at:j.createdAt});
  const entryRow=e=>({id:e.id,user_id:cloudUser.id,job_id:e.jobId,work_date:e.date,start_time:e.start,end_time:e.end,break_minutes:e.breakMinutes,hourly_rate:e.hourlyRate,note:e.note,created_at:e.createdAt});
  async function cloudUpsertJob(j){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from('jobs').upsert(jobRow(j)))}
  async function cloudUpsertEntry(e){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from('work_shifts').upsert(entryRow(e)))}
  async function cloudRemove(table,id){if(state.demo||!cloudReady())return;await dbRequest(()=>cloud.from(table).delete().eq('id',id))}
  async function loadCloud({auto=false}={}){if(!cloudReady())return;try{const [{data:j,error:je},{data:e,error:ee}]=await Promise.all([cloud.from('jobs').select('*').order('created_at',{ascending:true}),cloud.from('work_shifts').select('*').order('work_date',{ascending:false})]);if(je||ee)throw je||ee;if(auto&&!state.demo&&(state.jobs.length||state.entries.length))return;if(auto&&!j?.length&&state.demo)return;state.jobs=(j||[]).map(x=>({id:x.id,name:x.name,rate:Number(x.hourly_rate),color:x.color,createdAt:x.created_at}));state.entries=(e||[]).map(x=>({id:x.id,jobId:x.job_id,date:x.work_date,start:x.start_time.slice(0,5),end:x.end_time.slice(0,5),breakMinutes:Number(x.break_minutes),hourlyRate:Number(x.hourly_rate),note:x.note||'',createdAt:x.created_at}));state.demo=false;state.active='home';persist();cloudError='';render();if(modalType==='settings')renderModal();if(!auto)toast('Dina uppgifter har hämtats från Supabase')}catch(err){cloudError='Hämtning misslyckades: '+(err.message||'okänt fel')+' (har du kört supabase.sql?)';if(modalType==='settings')renderModal()}}
  async function pushCloud(){if(!cloudReady()||state.demo)return;try{cloudBusy=true;const jr=jobs().map(jobRow),er=state.entries.map(entryRow);if(jr.length){const {error}=await cloud.from('jobs').upsert(jr);if(error)throw error}if(er.length){const {error}=await cloud.from('work_shifts').upsert(er);if(error)throw error}cloudError='';toast('Lokala jobb och pass uppladdade till Supabase')}catch(err){cloudError='Uppladdning misslyckades: '+(err.message||'kontrollera databasen');toast('Kunde inte ladda upp allt')}finally{cloudBusy=false;if(modalType==='settings')renderModal()}}
  document.addEventListener('click',async ev=>{
    if(ev.target.id==='modal-backdrop'){closeModal();return}
    const el=ev.target.closest('[data-action],[data-go]');if(!el)return;
    if(el.dataset.go){state.active=el.dataset.go;drawerOpen=false;render();window.scrollTo({top:0,behavior:'auto'});return}
    const a=el.dataset.action;
    if(a==='drawer-open'){drawerOpen=true;render()}else if(a==='drawer-close'){drawerOpen=false;render()}else if(a==='new-job')openModal('new-job');else if(a==='edit-job')openModal('edit-job',el.dataset.id);else if(a==='new-entry'&&jobs().length)openModal('new-entry');else if(a==='edit-entry')openModal('edit-entry',el.dataset.id);else if(a==='close-modal')closeModal();else if(a==='color'){colorSelected=el.dataset.color;document.querySelectorAll('.color-choice').forEach(b=>b.classList.toggle('selected',b.dataset.color===colorSelected))}else if(a==='delete-entry')await removeEntry();else if(a==='delete-job')await removeJob();else if(a==='settings')openModal('settings');else if(a==='clear-demo')resetDemo();else if(a==='load-demo')setDemo();else if(a==='show-all'){state.active='all';render();window.scrollTo({top:0,behavior:'auto'})}else if(a==='export')exportData();else if(a==='import')document.getElementById('backup-file')?.click();else if(a==='cloud-pull'){if(confirm('Ersätta innehållet i appen med data från Supabase? Lokala uppgifter som inte har laddats upp kan gå förlorade.'))await loadCloud()}else if(a==='cloud-push')await pushCloud();else if(a==='cloud-logout'&&cloud){await cloud.auth.signOut();cloudUser=null;renderModal();render()}
  });
  document.addEventListener('input',e=>{if(e.target.closest('#entry-form'))updateLive()});document.addEventListener('change',e=>{if(e.target.closest('#entry-form'))updateLive()});
  document.addEventListener('submit',async e=>{
    if(e.target.id==='job-form'){e.preventDefault();await saveJob(e.target)}
    if(e.target.id==='entry-form'){e.preventDefault();await saveEntry(e.target)}
    if(e.target.id==='cloud-form'){e.preventDefault();const f=new FormData(e.target),url=String(f.get('cloudUrl')||'').trim().replace(/\/$/,''),key=String(f.get('cloudKey')||'').trim();if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(url)||!key){cloudError='Ange Supabase Project URL och en giltig publishable/anon key.';renderModal();return}config={url,key};localStorage.setItem(CONFIG,JSON.stringify(config));cloudError='';cloud=null;cloudUser=null;renderModal();await initCloud();toast('Supabase-inställningarna sparade')}
    if(e.target.id==='email-form'){e.preventDefault();if(!cloud){cloudError='Anslutningen är inte klar. Kontrollera projektuppgifterna.';renderModal();return}const email=String(new FormData(e.target).get('cloudEmail')||'').trim();try{cloudBusy=true;const {error}=await cloud.auth.signInWithOtp({email,options:{emailRedirectTo:location.protocol==='file:'?undefined:location.origin+location.pathname}});if(error)throw error;pendingEmail=email;localStorage.setItem(OTP_EMAIL_STORE,email);cloudError='';renderModal();document.getElementById('cloud-area')?.insertAdjacentHTML('afterbegin',`<div class="success">Inloggningsmejl begärt till ${h(email)}. Skriv in koden här när mejlet kommer. Om mejlet bara innehåller en länk behöver du först ändra Magic Link-mejlmallen i Supabase.</div>`)}catch(err){cloudError=err.message||'Det gick inte att skicka mejlet';renderModal()}finally{cloudBusy=false}}
    if(e.target.id==='otp-form'){e.preventDefault();if(!cloud){cloudError='Supabase-anslutningen är inte klar.';renderModal();return}const token=String(new FormData(e.target).get('cloudOtp')||'').replace(/\s/g,'');if(!/^\d{6,8}$/.test(token)){cloudError='Ange alla siffror i engångskoden.';renderModal();return}try{cloudBusy=true;const {data,error}=await cloud.auth.verifyOtp({email:pendingEmail,token,type:'email'});if(error)throw error;if(!data?.session?.user)throw new Error('Ingen inloggad session returnerades.');cloudUser=data.session.user;pendingEmail='';localStorage.removeItem(OTP_EMAIL_STORE);cloudError='';render();if(modalType==='settings')renderModal();toast('Inloggad i Supabase')}catch(err){cloudError='Kunde inte verifiera koden: '+(err.message||'försök igen med den senaste koden');renderModal()}finally{cloudBusy=false}}
  });
  document.addEventListener('change',async e=>{if(e.target?.id==='backup-file'){const file=e.target.files?.[0];await importData(file);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalType)closeModal()});
  render();if(config.url&&config.key)initCloud();
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Appinstallationsstöd kunde inte aktiveras:',err)));
  }
})();
</script>
